<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#27231f" />
    <title>食序 ORDINE · 离线</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #faf8f3;
        color: #27231f;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 420px);
        padding: 32px 28px;
        border: 1px solid rgba(39, 35, 31, 0.12);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 18px 48px rgba(39, 35, 31, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: rgba(39, 35, 31, 0.68);
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前处于离线状态</h1>
      <p>公共离线页仍可使用。恢复网络后，私人菜谱和购物变更会继续同步。</p>
    </main>
  </body>
</html>
