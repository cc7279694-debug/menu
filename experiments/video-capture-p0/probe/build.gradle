apply plugin: 'com.android.application'
android {
    namespace 'app.recipio.captureprobe'
    compileSdk 36
    defaultConfig {
        applicationId 'app.recipio.captureprobe'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0-video-p0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.all { maxHeapSize = '128m'; maxParallelForks = 1 } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
