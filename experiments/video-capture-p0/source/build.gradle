apply plugin: 'com.android.application'
android {
    namespace 'app.recipio.captureprobesource'
    compileSdk 36
    defaultConfig {
        applicationId 'app.recipio.captureprobesource'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '0.2.0-six-scene-source'
    }
    testOptions { unitTests.all { maxHeapSize = '128m'; maxParallelForks = 1 } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
